<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="static/index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LED Matrix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body class="bg-light">
    <div class="container py-4 col-10">
        <h3 class="mb-4 text-center">LED Matrix</h3>

        {% if no_connection %}
        <div class="alert alert-warning text-center">No Connection.</div>
        {% else %}
        {% for effect in effects %}
        <div class="effect-item {% if effect == active_effect %}active{% endif %}">
            <a href="/toggle/{{ effect }}" class="effect-link d-flex align-items-center">
                <span class="effect-name">{{ effect.upper() }}</span>
            </a>
            <a href="/settings/{{ effect }}" class="settings-link">
                <span class="material-icons settings-icon">settings</span>
            </a>
        </div>
        {% endfor %}
        <div class="mb-4">
            <label for="brightness" class="form-label">Brightness</label>
            <input type="range" class="form-range" id="brightness" min="0" max="255" step="1" value="{{ brightness }}">
        </div>
        {% endif %}
    </div>
    

    <script>
        document.getElementById('brightness').addEventListener('change', function () {
            const value = this.value;
            fetch('/set_brightness', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'brightness=' + encodeURIComponent(value)
            });
        });
    </script>
</body>

</html>
