<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="/static/index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ effect }} Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4 col-10">
    <h3 class="mb-4 text-center">Settings for {{ effect.upper() }}</h3>

    <form method="POST">
      {% for key, value in settings.items() %}
        <div class="mb-3">
          <label class="form-label">{{ key.capitalize() }}</label>
          {% if value is number or (value is string and value|length < 20) %}
            <input type="text" class="form-control" name="{{ key }}" value="{{ value }}">
          {% elif value is iterable and value is not string %}
            <input type="text" class="form-control" name="{{ key }}" value="{{ value | join(',') }}">
            <div class="form-text">Comma-separated values (e.g., RGBW)</div>
          {% else %}
            <textarea class="form-control" name="{{ key }}">{{ value }}</textarea>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Save Settings</button>
      <a href="/" class="btn btn-secondary">Back</a>
    </form>
  </div>
</body>
</html>
